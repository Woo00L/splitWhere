appId: com.woo00l.imgsplit
productName: splitWhere
copyright: Copyright © 2026 Woo00L
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - desktop/**
  - build/icon.png
  - package.json
  - '!**/*.test.*'
asar: true
npmRebuild: false
publish: null
mac:
  category: public.app-category.graphics-design
  icon: build/icon.icns
  identity: '-'
  hardenedRuntime: true
  notarize: false
  target:
    - target: dmg
      arch: [universal]
dmg:
  artifactName: splitWhere-${version}-macOS-Universal.${ext}
  title: splitWhere
  contents:
    - x: 140
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: splitWhere-${version}-Windows-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: splitWhere
  installerLanguages: [zh_CN, en_US]
  language: '2052'
portable:
  artifactName: splitWhere-${version}-Windows-Portable.${ext}
